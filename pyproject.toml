[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sebi-ra-automation"
dynamic = ["version"]
description = "SEBI Registered Adviser Trade Automation Software"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7.0",
    "openpyxl>=3.1.5",
    "Pillow>=12.1.1",
    "Telethon>=1.42.0",
    "gspread>=6.2.1",
    "google-auth>=2.49.1",
    "google-auth-oauthlib>=1.3.0",
    "smartapi-python>=1.5.5",
    "websockets>=12.0",
    "logzero>=1.7.0",
    "pyotp>=2.9.0",
    "cryptography>=46.0.5",
    "requests>=2.32.5",
    "psd-tools>=1.17.0",
    "icecream>=2.2.0",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.0"]

[project.scripts]
sebi-ra = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["gui*", "services*", "utils*", "core*", "database*", "controllers*"]

[tool.setuptools.dynamic]
version = {attr = "core.version.__version__"}
